spec_version: "1.0"

# --- Identity ---
name: PasswordRecoveryScreen
module: ":feature:auth"
package: "br.com.rbrthmn.auth.passwordrecovery"
contract: PasswordRecoveryScreenContract

description: >
  Two-step password recovery: verify the account e-mail, then set a new
  password. Local-only for now; a remote implementation will send a
  recovery e-mail instead.

# --- UiState ---
state:
  class: UiState
  fields:
    - name: step
      type: RecoveryStep
      default: "RecoveryStep.EMAIL"
    - name: email
      type: String
      default: '""'
    - name: newPassword
      type: String
      default: '""'
    - name: newPasswordConfirmation
      type: String
      default: '""'
    - name: isEmailValid
      type: Boolean
      default: "true"
    - name: isNewPasswordValid
      type: Boolean
      default: "true"
    - name: isNewPasswordConfirmationValid
      type: Boolean
      default: "true"
    - name: isLoading
      type: Boolean
      default: "false"
    - name: showAccountNotFoundError
      type: Boolean
      default: "false"

nested_states:
  - name: RecoveryStep
    kind: enum
    values: [EMAIL, NEW_PASSWORD]

# --- Intents ---
intents:
  - name: OnEmailChange
    params:
      - { name: value, type: String }
  - name: OnVerifyEmailClick
  - name: OnNewPasswordChange
    params:
      - { name: value, type: String }
  - name: OnNewPasswordConfirmationChange
    params:
      - { name: value, type: String }
  - name: OnResetPasswordClick
  - name: OnBackToSignInClick

# --- Effects ---
effects:
  - name: NavigateToSignIn
  - name: ShowPasswordResetSuccess

# --- Behaviors (acceptance criteria → test cases) ---
behaviors:
  - id: PRS-001
    description: "doOnInit should keep default state"
    given: "no stored session"
    when: "ViewModel initializes"
    then: "UiState equals defaults, step = EMAIL"

  - id: PRS-002
    description: "onEmailChange with invalid email should mark email invalid"
    given: "default state"
    when: "OnEmailChange with malformed e-mail"
    then: "email = given value, isEmailValid = false"

  - id: PRS-003
    description: "onVerifyEmailClick with unknown account should show account not found error"
    given: "repository returns AccountNotFound"
    when: "OnVerifyEmailClick"
    then: "showAccountNotFoundError = true, step = EMAIL"

  - id: PRS-004
    description: "onVerifyEmailClick with known account should advance to new password step"
    given: "repository returns Success"
    when: "OnVerifyEmailClick"
    then: "step = NEW_PASSWORD"

  - id: PRS-005
    description: "onNewPasswordChange with short password should mark new password invalid"
    given: "step = NEW_PASSWORD"
    when: "OnNewPasswordChange with fewer than 8 characters"
    then: "isNewPasswordValid = false"

  - id: PRS-006
    description: "onNewPasswordConfirmationChange with mismatch should mark confirmation invalid"
    given: "newPassword already set"
    when: "OnNewPasswordConfirmationChange with different value"
    then: "isNewPasswordConfirmationValid = false"

  - id: PRS-007
    description: "onResetPasswordClick with valid password should emit success and navigate to sign in"
    given: "repository resets password successfully"
    when: "OnResetPasswordClick"
    then: "Effects ShowPasswordResetSuccess and NavigateToSignIn emitted"

  - id: PRS-008
    description: "onResetPasswordClick with invalid fields should not call repository"
    given: "mismatching confirmation"
    when: "OnResetPasswordClick"
    then: "repository not called, fields marked invalid"

  - id: PRS-009
    description: "onBackToSignInClick should emit NavigateToSignIn"
    given: "any state"
    when: "OnBackToSignInClick"
    then: "Effect NavigateToSignIn emitted"

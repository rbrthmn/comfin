spec_version: "1.0"

name: MonthlyLimitCard
module: ":feature:home"
package: "br.com.rbrthmn.home.ui.components.monthlylimitcard"
contract: MonthlyLimitCardContract

description: >
  Displays the user's configured monthly spending limit alongside actual spending
  for the selected month. Filterable by month.

state:
  class: UiState
  fields:
    - name: monthLimit
      type: String
      default: '""'
    - name: monthDifference
      type: String
      default: '""'
    - name: currentDateFilter
      type: LocalDate
      default: "LocalDate.now()"

intents:
  - name: OnDateFilterChange
    params:
      - { name: date, type: LocalDate }

behaviors:
  - id: ML-001
    description: "doOnInit should display the monthly limit and spending difference"
    given: "a monthly limit is configured and spending data exists"
    when: "ViewModel initializes"
    then: "monthly limit and spending difference shown to the user"

  - id: ML-002
    description: "onDateFilterChange should update the selected month"
    given: "any state"
    when: "OnDateFilterChange with a date"
    then: "spending refers to the selected month"

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # 'cache: gradle' é bom, mas vamos adicionar um cache mais explícito abaixo
          # para maior controle e cobertura. Você pode manter ou remover este 'cache: gradle'
          # e testar qual configuração funciona melhor para você.
          # Se mantiver, o cache do actions/cache abaixo pode ser mais focado.
      #          cache: gradle

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle Build
        uses: actions/cache@v3
        with:
          path: .gradle/build-cache
          key: ${{ runner.os }}-gradle-build-cache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-${{ github.ref }}-
            ${{ runner.os }}-gradle-build-cache-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace --scan
#          # Para Pull Requests (incluindo para develop), construa e teste apenas debug
#          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.ref_name }}" == "develop" ]]; then
#          echo "Running debug build and tests for PR or develop branch..."
#          ./gradlew assembleDebug testDebugUnitTest --stacktrace --scan
#          # Para pushes diretos na main, considere construir release (e talvez rodar mais testes)
#          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "main" ]]; then
#          echo "Running release build for main branch..."
#          # Você pode querer adicionar :app:lintRelease ou outros testes aqui também
#          ./gradlew assembleRelease --stacktrace --scan
#          else
#          # Fallback ou para outros cenários não cobertos acima
#          echo "Running default build (all variants)..."
#          ./gradlew build --stacktrace --scan
#          fi
